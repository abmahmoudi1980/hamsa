name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.4'
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

      # Release keystore from a base64 GitHub secret. When the secret is not
      # configured (forks, test branches), the step exits early and Gradle
      # falls back to debug signing — the APK builds either way.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — falling back to debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - id: version
        run: |
          echo "version=$(sed -n 's/^version: *//p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://app.hamsa-home.ir/api/v1

      - name: Rename APK with pubspec version
        run: >
          cp build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/flutter-apk/hamsa-${{ steps.version.outputs.version }}-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hamsa-${{ steps.version.outputs.version }}-release
          path: mobile/build/app/outputs/flutter-apk/hamsa-${{ steps.version.outputs.version }}-release.apk
          retention-days: 30

      # Tag pushes (v*) → GitHub Release with the signed APK attached.
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/hamsa-${{ steps.version.outputs.version }}-release.apk
