# Hamsa backend configuration — copy to config.yaml and adjust.
# config.yaml is git-ignored; never commit real secrets.

app:
  # dev enables: mock payment gateway, verbose logging. Login is
  # phone+password; the first account is created via POST /auth/setup.
  # HTTP listen address
  addr: ":8080"
  # Base URL used to build gateway callback URLs (no trailing slash).
  base_url: "http://localhost:8080"
  # Where the browser client is served from — the single origin a completed
  # gateway payment may redirect a browser to (web/ sends this as return_path
  # on POST /invoices/{id}/pay; the callback 302s there). Set it to the web
  # app's origin in production, e.g. "https://app.hamsa-home.ir".
  #
  # Leave EMPTY to keep the Android-only behaviour: the callback then returns
  # the JSON body + hamsa:// deeplink that the APK consumes, and the browser
  # hand-off stays disabled.
  web_return_url: ""

db:
  # PostgreSQL DSN (docker-compose.yml provides this locally)
  dsn: "host=localhost port=5432 user=hamsa password=hamsa dbname=hamsa sslmode=disable"
  # Run pending migrations on startup
  auto_migrate: true

auth:
  # JWT signing secret (CHANGE IN PRODUCTION — 32+ random bytes)
  jwt_secret: "change-me-to-a-long-random-secret"
  # Access token lifetime
  access_ttl: 15m
  # Refresh token lifetime (rotating)
  refresh_ttl: 720h

payment:
  # mock | zarinpal — mock auto-verifies payments in dev
  provider: mock
  zarinpal:
    merchant_id: ""
    # Use sandbox while developing (sandbox.zarinpal.com)
    sandbox: true

cors:
  # Browser origins allowed to call the API cross-origin.
  #
  # Production: leave EMPTY. The web client is served from app.hamsa-home.ir,
  # the same origin that nginx proxies /api/ from, so no cross-origin request
  # is ever made and these headers are unnecessary. An empty list is the
  # correct, safest production setting — never "*" (it would allow any site to
  # read authenticated responses).
  #
  # Development: the Vite dev server runs on :5173. This project also proxies
  # /api through the dev server (vite.config.ts), which makes requests
  # same-origin and needs no CORS at all; the entries below are for the case
  # where you run the API directly and point the app at it explicitly.
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

storage:
  # Local disk storage root for uploaded files (receipts, photos, attachments)
  path: "./data/files"

push:
  # FCM is best-effort; leave empty to disable push (in-app notifications remain)
  fcm_credentials_file: ""
