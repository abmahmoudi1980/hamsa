<!doctype html>
<!--
	dir="rtl" and lang="fa" live in the STATIC HTML, before any JavaScript runs.
	The app is Persian-only and right-to-left; setting the direction later (or
	letting it default to ltr) would visibly flip the whole UI on load.
-->
<html lang="fa" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta name="description" content="سامانه مدیریت ساختمان همسا" />
		<!--
			The two faces used above the fold are preloaded so Persian text paints
			in the correct face on first render instead of reflowing after the
			font arrives (font-display: swap would otherwise show a fallback).
		-->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Vazirmatn-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Vazirmatn-700.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
