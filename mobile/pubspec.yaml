name: hamsa
description: "Hamsa — Building Management MVP (P0), Persian-only Android app."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Immutable models (code-generated)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Persian / Jalali calendar
  shamsi_date: ^1.0.4
  persian_datetime_picker: ^3.0.2

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.2

  # Attachments (receipts, request photos)
  image_picker: ^1.1.2

  # Localization plumbing for the single `fa` locale
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
