include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Code-generated files — never edit or lint
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - web/**

linter:
  rules:
    # Persian-only app: keep UI strings centralized in fa.arb / string constants
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    unnecessary_late: true
    use_super_parameters: true
