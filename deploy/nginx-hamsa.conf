# Hamsa — hamsa-home.ir + app.hamsa-home.ir
# Static website served directly on :443; /api/ proxied to the dockerized
# backend on loopback :8080. The Flutter app talks to app.hamsa-home.ir,
# which proxies the whole backend (certificates managed by certbot).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hamsa-home.ir;

    ssl_certificate     /etc/letsencrypt/live/hamsa-home.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamsa-home.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hamsa;
    index index.html;

    # Receipt photos / attachment uploads through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cache the APK long (immutable build artifact); HTML revalidated.
    location = /hamsa-release.apk {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Backend API — pass through unchanged (/api/v1/... paths are absolute).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hamsa-home.ir;

    # ACME renewals + http -> https.
    return 301 https://$host$request_uri;
}

# --- App origin (Flutter clients + the web client) ------------------------------
# One host serves BOTH the whole backend and (since 003-web-frontend) the SvelteKit
# SPA from web/build. Same-origin is the point: no CORS preflight, no cross-site
# token exposure, and one certificate.
#
# The SPA is client-routed, so unmatched paths must return the shell — but NOT for
# the API's own 404s, which must stay JSON. Hence /api/ and /files/ are matched
# explicitly below, ahead of the fallback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.hamsa-home.ir;

    ssl_certificate     /etc/letsencrypt/live/app.hamsa-home.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hamsa-home.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hamsa-app;
    index index.html;

    # Receipt photos / attachment uploads through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Vite content-hashed output: safe to cache hard, and the filename changes
    # whenever the bytes do.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # The HTML shell must never be cached, or a deploy would not reach users.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Self-hosted Vazirmatn subsets, named by weight rather than by content
    # hash — so a re-subset must not be blocked by a long-lived cache.
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Backend API — same origin as the app.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Uploaded files (receipts, photos, attachments).
    location /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA fallback. Everything else is a client route, so hand it to the shell and
    # let SvelteKit resolve it; without this, refreshing /m/buildings would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.hamsa-home.ir;

    # ACME renewals + http -> https.
    return 301 https://$host$request_uri;
}
