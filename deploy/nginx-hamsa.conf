# Hamsa — hamsa-home.ir + app.hamsa-home.ir
# Static website served directly on :443; /api/ proxied to the dockerized
# backend on loopback :8080. The Flutter app talks to app.hamsa-home.ir,
# which proxies the whole backend (certificates managed by certbot).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hamsa-home.ir;

    ssl_certificate     /etc/letsencrypt/live/hamsa-home.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamsa-home.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hamsa;
    index index.html;

    # Receipt photos / attachment uploads through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache the APK long (immutable build artifact); HTML revalidated.
    location = /hamsa-release.apk {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Backend API — pass through unchanged (/api/v1/... paths are absolute).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hamsa-home.ir;

    # ACME renewals + http -> https.
    return 301 https://$host$request_uri;
}

# App API origin (Flutter clients): the whole backend behind its own
# subdomain so the app never shares paths with the static website.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.hamsa-home.ir;

    ssl_certificate     /etc/letsencrypt/live/app.hamsa-home.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hamsa-home.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Receipt photos / attachment uploads through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.hamsa-home.ir;

    # ACME renewals + http -> https.
    return 301 https://$host$request_uri;
}
